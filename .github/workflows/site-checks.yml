name: Static site checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-local-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate local assets, resource data, and page links
        shell: pwsh
        run: ./scripts/check-site.ps1

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check asset versions
        run: npm run check:versions

      - name: Check classic-script globals
        run: npm run check:globals

      - name: Check home-page content
        run: npm run check:content

      - name: Validate HTML
        run: npm run check:html

      - name: Check CSS structure
        run: npm run check:css

      - name: Check shared partials
        run: npm run check:partials

      - name: Check offline precache list
        run: npm run check:precache

      - name: Check PDF metadata
        run: npm run check:pdf-meta

      - name: Check PDF budget
        run: npm run check:pdf-budget

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run accessibility and smoke tests
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Lighthouse budgets
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
