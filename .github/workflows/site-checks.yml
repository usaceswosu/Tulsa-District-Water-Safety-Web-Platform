name: Static site checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-local-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate local assets, resource data, and page links (PowerShell second opinion)
        shell: pwsh
        run: ./scripts/check-site.ps1

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check asset versions
        run: npm run check:versions

      - name: Check classic-script globals
        run: npm run check:globals

      - name: Check home-page content
        run: npm run check:content

      - name: Check Spanish translation dictionary
        run: npm run check:translations

      - name: Check resource metadata
        run: npm run check:metadata

      - name: Validate local assets, catalog, and page links (Node)
        run: npm run check:site

      - name: Check public site URL
        run: npm run check:site-url

      - name: Check resource structured data
        run: npm run check:resource-schema

      - name: Check static library cards
        run: npm run check:library

      - name: Check sitemap
        run: npm run check:sitemap

      - name: Check QR codes
        run: npm run check:qr

      - name: Check classroom pack
        run: npm run check:teacher-pack

      - name: Validate HTML
        run: npm run check:html

      - name: Check CSS structure
        run: npm run check:css

      - name: Check asset budgets
        run: npm run check:budgets

      - name: Check shared partials
        run: npm run check:partials

      - name: Check offline precache list
        run: npm run check:precache

      - name: Check PDF metadata
        run: npm run check:pdf-meta

      - name: Check PDF budget
        run: npm run check:pdf-budget

  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run accessibility and smoke tests
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Lighthouse budgets
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
