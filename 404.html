  <title>Page not found | Bobber the Water Safety Dog</title>
  <link rel="icon" type="image/png" href="https://usaceswosu.github.io/Tulsa-District-Water-Safety-Web-Platform/assets/bobber-logo.png">
  <style>
    :root {
      --ink: #16383d;
      --deep: #123c45;
      --coral: #f17658;
      --sand: #f2f8f5;
      --paper: #fffefa;
      --muted: #536866;
      --outline: #123c45;
      --display: "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: var(--sand);
      color: var(--ink);
      font-family: system-ui, "Segoe UI", Arial, sans-serif;
      line-height: 1.6;
    }

    .skip-link {
      position: absolute;
      left: 16px;
      top: -60px;
      padding: 10px 16px;
      background: #fff;
      border-radius: 6px;
      color: var(--deep);
    }

    .skip-link:focus { top: 12px; }

    .card {
      width: min(100%, 720px);
      padding: 42px 40px 38px;
      text-align: center;
      background: var(--paper);
      border: 4px solid var(--outline);
      border-radius: 28px;
      box-shadow: 6px 6px 0 var(--outline);
    }

    .card img {
      width: min(60%, 240px);
      height: auto;
      display: block;
      margin: 0 auto 8px;
    }

    .kicker {
      display: inline-block;
      margin: 0;
      padding: 5px 14px;
      background: #f7d978;
      border: 2px solid var(--outline);
      border-radius: 999px;
      box-shadow: 2px 2px 0 var(--outline);
      color: var(--deep);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 16px 0 10px;
      font: 900 clamp(34px, 6vw, 48px)/1.05 var(--display);
      letter-spacing: -.02em;
    }

    p {
      max-width: 460px;
      margin: 0 auto 24px;
      color: var(--muted);
      font-size: 16px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 22px;
      border: 4px solid var(--outline);
      border-radius: 999px;
      box-shadow: 4px 4px 0 var(--outline);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      color: #fff;
      background: var(--deep);
      transition: transform .15s, box-shadow .15s;
    }

    .button.coral {
      background: var(--coral);
      color: #102e32;
      transform: rotate(-2deg);
    }

    .button:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--outline);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e4eeea;
        --sand: #101c20;
        --paper: #1d3033;
        --muted: #a4b5b0;
        --outline: #6fa39a;
      }

      .kicker { color: #123c45; }
      .button.coral { color: #102e32; }
      .skip-link { background: #213336; color: #e4eeea; }
    }
  </style>
</head>
