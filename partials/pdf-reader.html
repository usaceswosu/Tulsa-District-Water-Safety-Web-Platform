<dialog class="pdf-reader" id="pdf-reader" aria-labelledby="pdf-reader-title">
  <div class="pdf-reader-panel">
    <div class="pdf-reader-header">
      <button class="pdf-reader-control" id="pdf-reader-close" type="button" autofocus>Back to the library</button>
      <a class="pdf-reader-control" id="pdf-reader-download">Download PDF</a>
      <a class="pdf-reader-control" id="pdf-reader-print-full" href="#" target="_blank" rel="noopener">Print full PDF</a>
      <h2 id="pdf-reader-title">PDF</h2>
    </div>
    <div class="pdf-reader-toolbar">
      <div class="pdf-reader-tools">
        <div class="pdf-reader-zoom" role="group" aria-labelledby="pdf-reader-zoom-label">
          <span class="pdf-reader-tool-label" id="pdf-reader-zoom-label">Zoom</span>
          <button class="pdf-reader-control pdf-reader-zoom-button" id="pdf-reader-zoom-out" type="button" aria-label="Zoom out">−</button>
          <span class="pdf-reader-zoom-value" id="pdf-reader-zoom-value" aria-live="polite">100%</span>
          <button class="pdf-reader-control pdf-reader-zoom-button" id="pdf-reader-zoom-in" type="button" aria-label="Zoom in">+</button>
          <button class="pdf-reader-control" id="pdf-reader-zoom-reset" type="button">Fit</button>
        </div>
        <form class="pdf-reader-jump" id="pdf-reader-jump">
          <label class="pdf-reader-tool-label" id="pdf-reader-page-label" for="pdf-reader-page-input">Page</label>
          <input id="pdf-reader-page-input" type="number" inputmode="numeric" min="1" value="1" aria-label="Page number">
          <span class="pdf-reader-page-total"><span id="pdf-reader-page-of">of</span> <span id="pdf-reader-page-total">1</span></span>
          <button class="pdf-reader-control" id="pdf-reader-go" type="submit">Go</button>
        </form>
        <button class="pdf-reader-control" id="pdf-reader-print-page" type="button">Print this page</button>
        <button class="pdf-reader-control" id="pdf-reader-toc-toggle" type="button" aria-expanded="false" aria-controls="pdf-reader-toc" hidden>Contents</button>
      </div>
      <nav class="pdf-reader-toc" id="pdf-reader-toc" aria-labelledby="pdf-reader-toc-title" hidden>
        <h3 id="pdf-reader-toc-title">Contents</h3>
        <ul id="pdf-reader-toc-list"></ul>
      </nav>
    </div>
    <div class="pdf-reader-stage" id="pdf-reader-stage"></div>
    <div class="pdf-print-page" id="pdf-print-page" aria-hidden="true"></div>
    <div class="pdf-reader-footer">
      <button class="pdf-reader-control" id="pdf-reader-prev" type="button" aria-disabled="true">Previous page</button>
      <p id="pdf-reader-status" role="status"></p>
      <button class="pdf-reader-control" id="pdf-reader-next" type="button" aria-disabled="true">Next page</button>
    </div>
  </div>
</dialog>
